name: Refresh public market snapshots
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: public-market-snapshot
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Restore previous public snapshot
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin market-data >/dev/null; then
            git fetch origin market-data
            git show FETCH_HEAD:bundle.json > /tmp/previous-market.json
          fi
      - name: Fetch providers and build normalized snapshot
        env:
          MARKET_ENV: development
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python backend/export_scheduled.py --previous /tmp/previous-market.json --output /tmp/market-bundle.json
      - name: Publish public JSON only
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin market-data >/dev/null; then
            git fetch origin market-data
            git checkout -B market-data FETCH_HEAD
          else
            git checkout --orphan market-data
            git rm -rf --ignore-unmatch .
          fi
          cp /tmp/market-bundle.json bundle.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p frontend
          printf '%s\n' '{"git":{"deploymentEnabled":false}}' > vercel.json
          cp vercel.json frontend/vercel.json
          git add bundle.json vercel.json frontend/vercel.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public research snapshot'
            git push origin HEAD:market-data
          fi
